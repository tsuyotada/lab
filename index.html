<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学習ログアプリ</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7f2;
      color: #1f2933;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    header {
      margin-bottom: 32px;
      text-align: center;
    }

    .label {
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 36px;
      color: #243326;
    }

    .lead {
      margin-top: 12px;
      font-size: 16px;
      color: #526057;
      line-height: 1.7;
    }

    .card {
      background: #ffffff;
      border: 1px solid #dde5d8;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 16px 40px rgba(31, 41, 51, 0.08);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      color: #243326;
    }

    textarea {
      width: 100%;
      min-height: 88px;
      padding: 12px 14px;
      border: 1px solid #cfd8c8;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.6;
      resize: vertical;
      box-sizing: border-box;
      font-family: inherit;
      background: #fbfcfa;
    }

    textarea:focus {
      outline: 3px solid #d8ead0;
      border-color: #7ba86b;
      background: #ffffff;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      background: #3f7d3b;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    button:hover {
      background: #32672f;
      transform: translateY(-1px);
    }

    .message {
      margin-top: 14px;
      font-size: 14px;
      color: #b45309;
      min-height: 20px;
    }

    .logs {
      margin-top: 32px;
    }

    .logs h2 {
      font-size: 22px;
      margin-bottom: 16px;
      color: #243326;
    }

    .empty {
      padding: 20px;
      border: 1px dashed #cfd8c8;
      border-radius: 16px;
      color: #6b7280;
      background: #fbfcfa;
      text-align: center;
    }

    .log-item {
      background: #ffffff;
      border: 1px solid #dde5d8;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .log-date {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 12px;
    }

    .log-section {
      margin-bottom: 12px;
    }

    .log-section:last-child {
      margin-bottom: 0;
    }

    .log-section strong {
      display: block;
      margin-bottom: 4px;
      color: #243326;
    }

    .log-section p {
      margin: 0;
      color: #3f4f46;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 28px;
      }

      .card {
        padding: 22px;
      }

      .container {
        padding: 32px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="label">Learning Log</div>
      <h1>学習ログアプリ</h1>
      <p class="lead">
        今日の学びを短く残して、次にやることを見えるようにします。
      </p>
    </header>

    <main>
      <section class="card">
        <div class="form-group">
          <label for="done">今日やったこと</label>
          <textarea id="done" placeholder="例：Claude CodeでHTMLファイルを編集した"></textarea>
        </div>

        <div class="form-group">
          <label for="trouble">困ったこと</label>
          <textarea id="trouble" placeholder="例：GitHubへのpushでエラーが出た"></textarea>
        </div>

        <div class="form-group">
          <label for="next">次にやること</label>
          <textarea id="next" placeholder="例：Vercelで本番URLを確認する"></textarea>
        </div>

        <button id="saveButton">ログを保存する</button>
        <div id="message" class="message"></div>
      </section>

      <section class="logs">
        <h2>保存したログ</h2>
        <div id="logList" class="empty">まだログはありません。</div>
      </section>
    </main>
  </div>

  <script>
    const doneInput = document.getElementById("done");
    const troubleInput = document.getElementById("trouble");
    const nextInput = document.getElementById("next");
    const saveButton = document.getElementById("saveButton");
    const message = document.getElementById("message");
    const logList = document.getElementById("logList");

    const logs = [];

    saveButton.addEventListener("click", function () {
      const done = doneInput.value.trim();
      const trouble = troubleInput.value.trim();
      const next = nextInput.value.trim();

      if (!done || !trouble || !next) {
        message.textContent = "3つの項目をすべて入力してください。";
        return;
      }

      const log = {
        done: done,
        trouble: trouble,
        next: next,
        date: new Date().toLocaleString("ja-JP")
      };

      logs.unshift(log);

      doneInput.value = "";
      troubleInput.value = "";
      nextInput.value = "";
      message.textContent = "";

      renderLogs();
    });

    function renderLogs() {
      logList.className = "";

      logList.innerHTML = logs.map(function (log) {
        return `
          <article class="log-item">
            <div class="log-date">${log.date}</div>

            <div class="log-section">
              <strong>今日やったこと</strong>
              <p>${escapeHtml(log.done)}</p>
            </div>

            <div class="log-section">
              <strong>困ったこと</strong>
              <p>${escapeHtml(log.trouble)}</p>
            </div>

            <div class="log-section">
              <strong>次にやること</strong>
              <p>${escapeHtml(log.next)}</p>
            </div>
          </article>
        `;
      }).join("");
    }

    function escapeHtml(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
