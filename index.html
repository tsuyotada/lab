<!DOCTYPE html> 
<html lang="ja"> 
<head> 
  <meta charset="UTF-8" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
  <title>Claude Code Demo App</title> 
  <style> 
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f7f8f5; color: #1f2933; } 
    main { text-align: center; padding: 40px; } 
    .label { font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: #6b7280; margin-bottom: 12px; } 
    h1 { font-size: 40px; margin: 0 0 16px; font-weight: 700; } 
    p { font-size: 18px; color: #4b5563; margin: 0; } 
  </style> 
</head> 
<body> 
  <main> 
    <div class="label">Claude Code Demo</div> 
    <h1>やってみましょう</h1> 
    <p>AI駆動開発！</p> 
  </main>

</html>
